            <script>
                function updateTable() {
                    fetch('/get_data_transactions')
                        .then(response => response.json())
                        .then(data => {
                            const tableBody = document.getElementById('tableBody');
                            tableBody.innerHTML = '';

                            // Reverse the order of the data array
                            const reversedData = data.reverse();
                            reversedData.forEach(item => {
                                const row = document.createElement('tr');
                                row.innerHTML = `<td ">
                            <p style="color: black; font-size: 16px;">TX HASH ${item.Transaction_Hash}</p>
                                        From ${item.From}</br>
                                            To ${item.To}
                                        </td>
                                        <td>
                                        </br>  Gas_Used ${item.Gas_Used}
                                        </br>Gas_Price ${item.Gas_Price} 
                                        </br>Gas_Limit ${item.Gas_Limit}
                                        </td>
                                        <td>
                                        </br>  Mined_In_Block ${item.Mined_In_Block} 
                                    </br>  Data ${item.Data} 
                                </br>   Value ${item.Value}
                                        </td>`;
                                tableBody.appendChild(row);
                            });
                        })
                        .catch(error => {
                            console.error('Error updating table:', error);
                        });
                }

                // Update the table immediately when the page loads
                updateTable();

                // Update the table every 5 seconds
                setInterval(updateTable, 5000);
            </script>
